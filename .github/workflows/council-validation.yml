name: Council real-provider readiness (no funds)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: council-readiness-validation
  cancel-in-progress: false
jobs:
  window:
    if: vars.COUNCIL_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.window.outputs.enabled }}
    steps:
      - id: window
        env:
          UNTIL: ${{ vars.COUNCIL_VALIDATION_UNTIL }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          until=os.environ.get('UNTIL')
          enabled=os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' or bool(until and datetime.fromisoformat(until.replace('Z','+00:00'))>datetime.now(timezone.utc))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('enabled='+str(enabled).lower()+'\n')
          PY
  validate:
    needs: window
    if: needs.window.outputs.enabled == 'true'
    uses: ./.github/workflows/council-actions.yml
    with:
      preflight: true
    secrets: inherit
