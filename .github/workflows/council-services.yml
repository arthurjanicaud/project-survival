name: Council research and notification relay
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-external-services
  cancel-in-progress: false
jobs:
  services:
    if: vars.COUNCIL_ACTIONS_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COUNCIL_API_URL: ${{ vars.COUNCIL_API_URL }}
      COUNCIL_ADMIN_TOKEN: ${{ secrets.COUNCIL_ADMIN_TOKEN }}
      COUNCIL_NTFY_TOPIC: ${{ secrets.COUNCIL_NTFY_TOPIC }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx python-dotenv
      - uses: actions/cache/restore@v4
        with:
          path: data/reform-watchdog.json
          key: reform-watchdog-${{ github.run_id }}
          restore-keys: reform-watchdog-
      - name: Check independent progress
        id: watchdog
        run: python operations/reform_watchdog.py
      - name: Relay phone notifications
        if: steps.watchdog.outputs.storage_blocked != 'true'
        run: python operations/council_collect.py notifications
      - name: Measure account-wide storage budget
        if: steps.watchdog.outputs.storage_blocked != 'true'
        run: python operations/cloudflare_usage.py
      - name: Collect shared public research
        if: steps.watchdog.outputs.storage_blocked != 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *')
        # Collector itself checks the last feed timestamp; no LLM or trading job.
        run: python operations/council_collect.py research
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/reform-watchdog.json') != ''
        with:
          path: data/reform-watchdog.json
          key: reform-watchdog-${{ github.run_id }}
